name: CI Backend (Postgres)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitplanner_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitplanner_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - list workspace
        run: |
          echo "PWD: $(pwd)"
          echo "Root listing:"
          ls -la
          echo "Backend listing:"
          ls -la Backend || true
          echo "Has Backend/package-lock.json?"
          if [ -f Backend/package-lock.json ]; then echo "YES"; else echo "NO"; fi


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix Backend

      - name: Wait for Postgres (tcp)
        run: npx wait-on tcp:127.0.0.1:5432 --timeout 120000

      - name: Lint code
        run: npm --prefix Backend run lint

      - name: Run tests
        run: npm --prefix Backend run test -- --coverage --watchAll=false
        env:
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./Backend/coverage/lcov.info
          flags: backend
          name: codecov-umbrella

      - name: Build project
        run: npm --prefix Backend run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: Backend/dist/
