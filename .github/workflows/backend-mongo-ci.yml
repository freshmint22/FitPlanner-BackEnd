name: Backend CI (Mongo service)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    env:
      MONGODB_URI: mongodb://localhost:27017/fitplanner

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - list workspace
        run: |
          echo "PWD: $(pwd)"
          echo "Root listing:"
          ls -la
          echo "Working directory listing (Backend):"
          ls -la || true
          echo "Has Backend/package-lock.json?"
          if [ -f package-lock.json ]; then echo "YES"; else echo "NO"; fi

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for MongoDB (Corrected Host)
        run: npx wait-on tcp:127.0.0.1:27017 --timeout 120000

      - name: Seed database
        run: npm run seed

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
