name: Backend CI (Mongo service)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6

    env:
      MONGODB_URI: mongodb://mongo:27017/fitplanner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Wait for mongo to be ready
        run: npx wait-on tcp:mongo:27017 --timeout 120000

      - name: Seed database
        working-directory: ./Backend
        run: npm run seed

      - name: Lint
        working-directory: ./Backend
        run: npm run lint

      - name: Validate commit messages (PR only)
        if: github.event_name == 'pull_request'
        working-directory: ./Backend
        run: |
          npx --no -- commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.sha }} || true

      - name: Run tests
        working-directory: ./Backend
        run: npm test
