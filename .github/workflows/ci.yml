name: Backend CI (Mongo service)
name: Backend CI (Mongo service)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://mongo:27017/fitplanner

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Wait for MongoDB to be ready
        run: |
          echo "Waiting for MongoDB..."
          sleep 10

      - name: Seed database
        working-directory: Backend
        run: npm run seed
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}

      - name: Lint
        working-directory: Backend
        run: npm run lint

      - name: Validate commit messages (PR only)
        if: github.event_name == 'pull_request'
        working-directory: Backend
        run: |
          npx --no -- commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.sha }} || true

      - name: Run tests
        working-directory: Backend
        run: npm test

