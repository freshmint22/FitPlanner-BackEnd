name: Backend CI (Mongo service)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://mongo:27017/fitplanner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for mongo to be ready
        run: npx wait-on tcp:mongo:27017 --timeout 120000

      - name: Debug Docker containers
        run: |
          echo "Docker ps -a:"
          docker ps -a || true
          echo "\nLogs for mongo containers (if any):"
          for id in $(docker ps -aqf "name=mongo"); do
            echo "=== logs for $id ==="
            docker logs "$id" || true
          done

      - name: Seed database
        run: npm run seed

      - name: Lint
        run: npm run lint

      - name: Validate commit messages (PR only)
        if: github.event_name == 'pull_request'
        run: |
          npx --no -- commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.sha }} || true

      - name: Run tests
        run: npm test
