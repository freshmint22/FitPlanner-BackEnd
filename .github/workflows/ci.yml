name: Backend CI (Mongo service)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      MONGODB_URI: mongodb://mongo:27017/fitplanner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for mongo to accept connections
        run: |
          echo "Waiting for MongoDB..."
          for i in {1..20}; do
            nc -z mongo 27017 && echo "MongoDB is ready!" && break
            echo "Mongo not ready yet..."
            sleep 2
          done

      - name: Seed database
        run: npm run seed

      - name: Lint
        run: npm run lint

      - name: Validate commit messages (PR only)
        if: github.event_name == 'pull_request'
        run: |
          npx --no -- commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.sha }} || true

      - name: Run tests
        run: npm test
