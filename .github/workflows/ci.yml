name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend CI (lint → test → build → audit → artifact)
    runs-on: ubuntu-20.04
    defaults:
      run:
        working-directory: .
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      MONGODB_URI: mongodb://localhost:27017/fitplanner_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Wait for MongoDB
        run: npx wait-on tcp:127.0.0.1:27017 --timeout 120000

      - name: Run Tests with Coverage
        run: npm test -- --coverage --watchAll=false

      - name: Enforce coverage threshold (>=70% lines)
        run: |
          node -e "const fs=require('fs'); const path='coverage/coverage-summary.json'; if(!fs.existsSync(path)){console.error('Coverage summary not found'); process.exit(1);} const cov=JSON.parse(fs.readFileSync(path,'utf8')); const pct=cov.total.lines.pct; console.log('Lines coverage:',pct+'%'); if(pct<70){console.error('Coverage below 70%'); process.exit(1);}"

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=moderate || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: dist/
