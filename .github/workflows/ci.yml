name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test-mongo:
    name: Test (Mongo)
    runs-on: ubuntu-20.04
    defaults:
      run:
        working-directory: Backend
    env:
      MONGODB_URI: mongodb://localhost:27017/fitplanner
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for MongoDB (tcp)
        run: npx wait-on tcp:127.0.0.1:27017 --timeout 120000

      - name: Seed database
        run: npm run seed

      - name: Run tests
        run: npm test

  test-postgres:
    name: Test (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
