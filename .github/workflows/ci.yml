name: Backend CI (Mongo service)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      MONGODB_URI: mongodb://localhost:27017/fitplanner

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json 
      
      # El caching automático de setup-node ya maneja las rutas de ~/.npm y node_modules

      - name: Install backend dependencies
        # El directorio de trabajo es la raíz del repo (Backend)
        run: npm ci

      - name: Install wait-on for connection check
        run: npm install wait-on

      - name: Wait for MongoDB to be ready (FIXED Host)
        run: ./node_modules/.bin/wait-on tcp:127.0.0.1:27017 --timeout 60000

      - name: Seed database
        run: npm run seed
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}

      - name: Lint
        run: npm run lint

      - name: Validate commit messages (PR only)
        if: github.event_name == 'pull_request'
        run: |
          echo "Running commitlint on PR commits"
          npx --no -- commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.sha }} || true

      - name: Run tests
        run: npm test