name: Backend CI (Mongo service)

on:
  push:
    branches: [ main, develop ]
    paths:
      - "Backend/**"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "Backend/**"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    services:
      mongo:
        image: mongo:6

    env:
      MONGODB_URI: mongodb://mongo:27017/fitplanner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Wait for mongo to be ready
        run: npx wait-on tcp:mongo:27017 --timeout 120000

      - name: Seed database
        run: npm run seed

      - name: Lint
        run: npm run lint

      - name: Validate commit messages (PR only)
        if: github.event_name == 'pull_request'
        run: |
          npx --no -- commitlint \
            --from=${{ github.event.pull_request.base.sha }} \
            --to=${{ github.sha }} || true

      - name: Run tests
        run: npm test
