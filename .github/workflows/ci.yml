name: Backend CI (Mongo service)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://mongo:27017/fitplanner

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Ensure cache paths exist (debug)
        run: |
          echo "Creating cache directories if missing"
          mkdir -p Backend/node_modules
          mkdir -p "$HOME/.npm"
          echo "Cache paths prepared"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            Backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('Backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: List repository (debug)
        run: |
          echo "Repository root: $PWD"
          ls -la
          echo "Contents of Backend:" || true
          ls -la Backend || true

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci --prefix Backend

      - name: Wait for MongoDB to be ready
        run: |
          echo "Waiting for MongoDB..."
          sleep 10

      - name: Seed database
        run: npm run seed --prefix Backend
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}

      - name: Lint
        run: npm run lint --prefix Backend

      - name: Validate commit messages (PR only)
        if: github.event_name == 'pull_request'
        run: |
          echo "Running commitlint on PR commits"
          npx --no -- commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.sha }} || true

      - name: Run tests
        run: npm test --prefix Backend
